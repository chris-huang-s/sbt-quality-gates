name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Compile plugin
        run: sbt -batch compile
      - name: Publish plugin locally
        run: sbt -batch publishLocal

  example-gates:
    name: Example quality gates
    runs-on: ubuntu-latest
    needs: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Publish plugin locally
        run: sbt -batch publishLocal
      - name: Run example quality gates
        working-directory: example
        run: sbt -batch qualityGates
