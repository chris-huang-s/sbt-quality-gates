name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  scalafmt:
    name: Scalafmt gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting (plugin)
        run: sbt -batch scalafmtCheckAll
      - name: Check formatting (example)
        working-directory: example
        run: sbt -batch scalafmtCheckAll

  plugin:
    name: Build plugin (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: scalafmt
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile plugin
        run: sbt -batch compile
      - name: Publish plugin locally
        run: sbt -batch publishLocal

  example-gates:
    name: Example quality gates (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: plugin
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Publish plugin locally
        run: sbt -batch publishLocal
      - name: Run example quality gates
        working-directory: example
        run: sbt -batch qualityGates
